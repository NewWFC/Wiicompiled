schema_version: 1
workspace_root: ../..

project:
  id: mkwii-rmcp01
  display_name: Mario Kart Wii PAL
  game_id: RMCP01
  region: P
  base_manifest_format: mkwii-recomp-base-manifest
  base_manifest_stem: mkwii_base

memory:
  base: 0x80000000
  size: 0x01A00000
  sda_base: 0x8038CC00
  sda2_base: 0x8038EFA0

inputs:
  dol:
    path: Assets/main.dol
    sha256: 80d18895b39c63bd80f457398bfcbb91b7d16ac116a41a88967e954080155b05

  rel:
    path: Assets/StaticR.rel
    load_address: 0x805102E0
    sha256: 16d9d146112541fefea701ecb5bc1a496f9d50e4a752fbb5b6778e7c6399f67d

translation:
  entry_points:
    - 0x800060A4
  function_map:
    path: projects/mkwii/MAP.txt

  #just a precaution, but this should never be needed for MKWii
  allow_unsupported_instructions: false 

runtime:
  native_registration_root: runtime/src
  native_abi_directories:
    - runtime/src/hle/gx

output:
  root: generated
  functions: functions
  runtime_config: RuntimeConfig.h
  data_initializer: data_sections_init.cpp
  base_manifest: ../build/base/mkwii_base_manifest.json

# NewWFC-Legacy: opt-in (--enable-legacy-wfc on generate-data-init) redirect of the base game's own
# embedded GameSpy/NAS hostnames to a replacement domain, since Nintendo's real WFC servers are gone.
# Applies independently of any profile - it rewrites literal strings already in the game's data
# sections rather than lowering a signed patch payload, so it needs no module memory region and
# works for the plain base build, not just Retro Rewind's own Retro-WFC payload mechanism.
legacy_wfc:
  domain: newwfc.xyz
  rewrite_hosts:
    - nintendowifi.net
    - gamespy.net

# Gecko/Action Replay "basic write" codes (types 00/01, 02/03, 04/05, 06/07, 08/09 - ba-relative
# only, 'po' unsupported) whose target lands in executable game code (DOL or StaticR.rel) - a runtime
# memory write can't change compiled behavior there (see
# runtime/include/cheat_codes.h), so these get baked into the DOL/REL bytes *before*
# translate-recursive decodes instructions from them, and the translator compiles the patched
# instruction instead of the original. A data/RAM-target code does NOT belong here - it needs
# per-frame reapplication against game logic, which only Config.toml's runtime [cheats] list does;
# a code_patches entry targeting non-executable data fails the build with that pointer. Empty by
# default - always applied when present, no opt-in flag (unlike legacy_wfc, this always changes
# what gets compiled, so there's no "same build either way" case to gate).
# code_patches:
#   - "04381F40 60000000"
profiles:
  retro-rewind:
    enabled: true
    requires_game_id: RMCP01
    requires_dol_sha256: 80d18895b39c63bd80f457398bfcbb91b7d16ac116a41a88967e954080155b05
    code_pul: PulsarPacks/completed/RetroRewind/RetroRewind6/Binaries/Code.pul
    mod_root: PulsarPacks/completed/RetroRewind/RetroRewind6
    region: P
    module_guest_base: 0x81800000
    module_link_base: 0x803992E0
    output: build/mods/retro_rewind_full_cpp
    enable_retro_wfc: true
    retro_wfc_payload: http://nas.newwfc.xyz/payload?g=RMCPD00
    retro_wfc_legacy_bootstrap_hook: 0x800ED6E8
    riivolution:
      xml: xml/RetroRewind6.xml
      options:
        - section: Retro Rewind
          option: Pack
          choice: 1
